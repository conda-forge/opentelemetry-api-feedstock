{% set version = "1.45.2" %}

package:
  name: opentelemetry-api
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/opentelemetry-api/opentelemetry_api-{{ version }}.tar.gz
  sha256: d7b0008e21e5fd61cbe7a7f34ca3b6905a78ab677d9bc395e299359c75cda6b4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - typing-extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0

test:
  imports:
    - opentelemetry
    - opentelemetry.context
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/open-telemetry/opentelemetry-python/tree/main/opentelemetry-api
  summary: OpenTelemetry Python API
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
    - marcelotrevisani
