{% set version = "1.43.0" %}

package:
  name: opentelemetry-api
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-api/opentelemetry_api-{{ version }}.tar.gz
  sha256: 107d0d03857ea8fc7c5fcbbbd83f800c281f0d560553d61c1d675fccfd1761c1

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - typing-extensions >=4.5.0
    - importlib-metadata >=6.0,<8.8.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0
    # - typing_extensions >=4.5.0

test:
  imports:
    - opentelemetry
    - opentelemetry.context
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/open-telemetry/opentelemetry-python/tree/main/opentelemetry-api
  summary: OpenTelemetry Python API
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
    - mariusvniekerk
    - marcelotrevisani
